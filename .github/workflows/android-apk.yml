name: Build VIVO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, vivo-original-upgrade-2026-11-20]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'www/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: vivo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Verify Capacitor configuration
        run: npx cap --version && test -f capacitor.config.json && test -f www/index.html
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIVO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vivo-android-${{ github.run_number }}
          name: VIVO Android build ${{ github.run_number }}
          body: |
            VIVO Android installable build.
            Debug APK for installation and testing. The app loads the VIVO preview deployment.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
